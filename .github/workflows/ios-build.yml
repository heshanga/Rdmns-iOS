name: Build & Export iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build iOS App with xcodebuild
        run: |
          mkdir -p build
          xcodebuild -scheme RdmnsiOS -sdk iphoneos -configuration Release -derivedDataPath build/DerivedData CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || true

      - name: Create Payload and Zip IPA
        run: |
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/*.app build/Payload/ || true
          cd build
          zip -r Rdmns_v1.0.6.ipa Payload

      - name: Send IPA File to Telegram
        env:
          TELEGRAM_TOKEN: "8220698805:AAHHTHiEZ23axyTcOLyoPBWCl3MoUN9Qr88"
          TELEGRAM_CHAT_ID: "337041776"
        run: |
          curl -F chat_id="$TELEGRAM_CHAT_ID" -F document=@"build/Rdmns_v1.0.6.ipa" -F caption="🍏 Rdmns iOS App (IPA Build v1.0.6)" "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument"
